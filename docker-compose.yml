# Local orchestration for Cartographer.
#
#   docker compose up --build app          # start Postgres + the app
#   docker compose --profile seed run --rm seed   # one-off DB schema + seed
#
# The `app` image is environment-agnostic: Postgres and all secrets come in as
# env vars. On AWS the `db` service below is replaced by RDS; nothing else changes.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cartographer
    ports:
      # Host access on 5433 (maps to container 5432) to avoid colliding with a
      # Postgres already running on the host's 5432. The app reaches the DB over
      # the internal compose network as `db:5432` regardless of this mapping.
      - "5433:5432"
    volumes:
      - cartographer-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cartographer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runner
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Override the host port with APP_PORT if 3000 is taken (e.g. `pnpm dev`
      # already running): `APP_PORT=3001 docker compose up app`.
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      # Override the host-oriented DATABASE_URL from .env.local: inside the
      # compose network Postgres is reachable at the service name `db`.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cartographer

  # One-off schema + seed. Uses the `builder` stage (has devDeps incl. tsx and
  # the db/ source). Never runs on a normal `up` — it's behind the `seed` profile.
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cartographer
    command: ["pnpm", "db:seed:docker"]

volumes:
  cartographer-db:
